<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>一束鲜花</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07080b;color:#f8f4ef;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}body{min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 47%,#27201f 0,#111116 30%,#07080b 70%)}
.preview-shell{position:relative;min-height:100vh;display:grid;place-items:center;padding:30px 24px calc(30px + env(safe-area-inset-bottom));isolation:isolate}.preview-shell:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at center,rgba(245,203,157,.075),transparent 43%)}
.gift-cover{--line:#8fbce8;appearance:none;position:relative;width:min(82vw,340px);height:360px;border:0;padding:0;color:inherit;cursor:pointer;background:transparent;filter:drop-shadow(0 0 20px color-mix(in srgb,var(--line) 14%,transparent));transition:transform .3s ease,filter .3s ease}.gift-cover[data-box-style="pink"]{--line:#f2adc7}.gift-cover[data-box-style="white"]{--line:#f2efe8}.gift-cover[data-box-style="red"]{--line:#ef6b6f}.gift-cover:active{transform:scale(.97)}.gift-cover:focus-visible{outline:0;filter:drop-shadow(0 0 28px color-mix(in srgb,var(--line) 28%,transparent))}.gift-cover:before{content:"";position:absolute;left:50%;top:42%;width:230px;height:230px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--line) 12%,transparent),color-mix(in srgb,var(--line) 3%,transparent) 42%,transparent 70%);animation:breathe 3.2s ease-in-out infinite}.gift-cover.opening{pointer-events:none;animation:giftShake .88s cubic-bezier(.36,.07,.19,.97) both;filter:drop-shadow(0 0 34px color-mix(in srgb,var(--line) 40%,transparent))}.gift-cover.opening .gift-art{animation:giftLift .88s ease-in-out both}
.gift-art{position:absolute;left:50%;top:42%;width:280px;height:280px;transform:translate(-50%,-50%);overflow:visible}.gift-art .shape{fill:color-mix(in srgb,var(--line) 2.5%,transparent);stroke:var(--line);stroke-width:1.28;stroke-linecap:round;stroke-linejoin:round;filter:url(#lineGlow)}.gift-art .soft{fill:color-mix(in srgb,var(--line) 4%,transparent);stroke:color-mix(in srgb,var(--line) 78%,transparent);stroke-width:1.08;stroke-linecap:round;stroke-linejoin:round}.gift-art .bow-fill{fill:#141116;stroke:var(--line);stroke-width:1.28;stroke-linecap:round;stroke-linejoin:round;filter:url(#lineGlow)}.gift-art .spark-line{stroke:color-mix(in srgb,var(--line) 78%,transparent);stroke-width:1;stroke-linecap:round;filter:url(#lineGlow)}.box-variant{display:none}.variant-b{display:block}
.spark{position:absolute;left:50%;top:45%;width:3px;height:3px;border-radius:50%;background:color-mix(in srgb,var(--line) 84%,white);box-shadow:0 0 9px 3px color-mix(in srgb,var(--line) 66%,transparent);animation:twinkle 2.4s ease-in-out infinite}.spark:before,.spark:after{content:"";position:absolute;left:1px;top:1px;background:color-mix(in srgb,var(--line) 72%,transparent);transform:translate(-50%,-50%)}.spark:before{width:1px;height:22px}.spark:after{width:22px;height:1px}.spark.s1{margin:-126px 0 0 -124px}.spark.s2{margin:-54px 0 0 128px;transform:scale(.65);animation-delay:.8s}.spark.s3{margin:91px 0 0 -132px;transform:scale(.5);animation-delay:1.4s}.spark.s4{margin:122px 0 0 98px;transform:scale(.42);animation-delay:.35s}
.gift-name{position:absolute;left:0;right:0;bottom:28px;display:flex;flex-direction:column;align-items:center;color:color-mix(in srgb,var(--line) 78%,white);text-shadow:0 0 18px color-mix(in srgb,var(--line) 28%,transparent)}.gift-name .cn{font-family:"Songti SC","STSong","Times New Roman",serif;font-size:24px;font-weight:400;letter-spacing:7px;text-indent:7px}.gift-name .en{margin-top:7px;font-family:"Bodoni 72 Smallcaps","Didot","Times New Roman",serif;font-size:8px;font-weight:500;letter-spacing:3.2px;color:color-mix(in srgb,var(--line) 66%,transparent)}
.gift-stage{display:flex;flex-direction:column;align-items:center}.gift-types,.box-styles{position:relative;z-index:2;display:grid;gap:8px;width:min(88vw,350px)}.gift-types{grid-template-columns:repeat(3,1fr);margin-top:1px}.box-styles{grid-template-columns:repeat(4,1fr);margin-top:9px}.gift-types button,.box-styles button{appearance:none;border:1px solid color-mix(in srgb,var(--choice,#e8c6a5) 17%,transparent);border-radius:999px;padding:8px 5px;background:rgba(255,255,255,.025);color:rgba(242,225,209,.5);font-family:"Avenir Next","PingFang SC",sans-serif;font-size:10px;letter-spacing:.7px;cursor:pointer;transition:.22s ease}.gift-types button.on,.box-styles button.on{border-color:color-mix(in srgb,var(--choice,#e8c6a5) 60%,transparent);background:color-mix(in srgb,var(--choice,#e8c6a5) 9%,transparent);color:color-mix(in srgb,var(--choice,#e8c6a5) 72%,white);box-shadow:0 0 18px color-mix(in srgb,var(--choice,#e8c6a5) 12%,transparent)}
@keyframes breathe{50%{opacity:.55;transform:translate(-50%,-50%) scale(1.08)}}@keyframes twinkle{0%,100%{opacity:.28}50%{opacity:1}}@keyframes giftShake{0%,100%{transform:translateX(0) rotate(0)}12%{transform:translateX(-4px) rotate(-1.2deg)}24%{transform:translateX(4px) rotate(1.2deg)}38%{transform:translateX(-6px) rotate(-1.6deg)}52%{transform:translateX(6px) rotate(1.6deg)}68%{transform:translateX(-3px) rotate(-.7deg)}82%{transform:translateX(3px) rotate(.7deg)}}@keyframes giftLift{0%,62%{transform:translate(-50%,-50%)}78%{transform:translate(-50%,-55%)}100%{transform:translate(-50%,-50%)}}@media (prefers-reduced-motion:reduce){.gift-cover:before,.spark{animation:none}.gift-cover.opening,.gift-cover.opening .gift-art{animation-duration:.12s}}@media (hover:hover){.gift-cover:hover{transform:translateY(-4px);filter:drop-shadow(0 0 27px color-mix(in srgb,var(--line) 25%,transparent))}}
</style>
</head>
<body>
<main class="preview-shell">
 <div class="gift-stage">
  <button class="gift-cover" id="play" type="button" data-box-style="blue" aria-label="拆开当前礼物">
    <svg class="gift-art" viewBox="0 0 300 300" aria-hidden="true">
      <defs><filter id="lineGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2" result="blur"></feGaussianBlur><feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter></defs>
      <g class="box-variant variant-b">
        <rect class="shape" x="70" y="110" width="160" height="126" rx="14"></rect><path class="shape" d="M61 104h178v27H61zM137 104h26v132M70 174h160"></path>
        <path class="soft" d="M145 98c-24-28-60-29-65-8-4 17 25 22 62 18M155 98c24-28 60-29 65-8 4 17-25 22-62 18"></path><path class="bow-fill" d="M139 96q11-10 22 0l-3 18h-16z"></path>
        <path class="spark-line" d="M48 75v20M38 85h20M250 152v14M243 159h14"></path>
      </g>
      <path class="spark-line" d="M38 77v17M30 85h17M264 83v13M257 89h14M252 205v10M247 210h10M40 197v9M36 201h9"></path>
    </svg>
    <span class="spark s1" aria-hidden="true"></span>
    <span class="spark s2" aria-hidden="true"></span>
    <span class="spark s3" aria-hidden="true"></span>
    <span class="spark s4" aria-hidden="true"></span>
    <span class="gift-name" id="giftName"><span class="cn" id="giftNameCn">一束鲜花</span><span class="en" id="giftNameEn">A BOUQUET OF FLOWERS</span></span>
  </button>
  <nav class="gift-types" aria-label="礼物预览类型">
    <button class="on" type="button" data-kind="flower">一束鲜花</button>
    <button type="button" data-kind="teddy">玩偶礼物</button>
    <button type="button" data-kind="ring">订婚戒指</button>
  </nav>
  <nav class="box-styles" aria-label="礼盒样式">
    <button class="on" style="--choice:#8fbce8" type="button" data-box-choice="blue">01 蓝色</button>
    <button style="--choice:#f2adc7" type="button" data-box-choice="pink">02 粉色</button>
    <button style="--choice:#f2efe8" type="button" data-box-choice="white">03 白色</button>
    <button style="--choice:#ef6b6f" type="button" data-box-choice="red">04 红色</button>
  </nav>
 </div>
</main>
<script src="gift-effects.js?v=preview-1"></script>
<script>
var currentGiftKind='flower';
var giftLabels={flower:'一束鲜花',teddy:'玩偶礼物',ring:'订婚戒指'};
var giftEnglish={flower:'A BOUQUET OF FLOWERS',teddy:'PLUSH COMPANION',ring:'ENGAGEMENT RING'};
var giftOpening=false;
function playCurrentGift(){var common={sender:'角色名',fullMotion:true};if(currentGiftKind==='teddy')playTeddyGiftEffect(common);else if(currentGiftKind==='ring')playRingGiftEffect(common);else playBouquetGiftEffect(Object.assign(common,{giftName:'一束鲜花'}));}
function openCurrentGift(){if(giftOpening)return;giftOpening=true;var cover=document.getElementById('play');cover.classList.add('opening');setTimeout(function(){cover.classList.remove('opening');giftOpening=false;playCurrentGift();},880);}
document.getElementById('play').addEventListener('click',openCurrentGift);
document.querySelectorAll('[data-kind]').forEach(function(button){button.addEventListener('click',function(){currentGiftKind=button.dataset.kind;document.getElementById('giftNameCn').textContent=giftLabels[currentGiftKind];document.getElementById('giftNameEn').textContent=giftEnglish[currentGiftKind];document.querySelectorAll('[data-kind]').forEach(function(item){item.classList.toggle('on',item===button);});});});
document.querySelectorAll('[data-box-choice]').forEach(function(button){button.addEventListener('click',function(){document.getElementById('play').dataset.boxStyle=button.dataset.boxChoice;document.querySelectorAll('[data-box-choice]').forEach(function(item){item.classList.toggle('on',item===button);});});});
</script>
</body>
</html>
