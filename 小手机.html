.hwid{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;min-height:104px;padding:13px;background:rgba(255,255,255,.13);backdrop-filter:blur(10px);border-radius:18px;border:1px solid rgba(255,255,255,.14);cursor:pointer;box-sizing:border-box;}

.home .hwid.wpet,.home.tpink .hwid.wpet,.home.twhite .hwid.wpet{background:transparent!important;border:none!important;box-shadow:none!important;backdrop-filter:none!important;}
.wpet{align-items:center;justify-content:center;text-align:center;gap:3px;padding:4px;}

.petcat .peyes{transform-box:fill-box;transform-origin:center;animation:pblink 4.5s infinite;}

@keyframes pzfloat{0%{opacity:0;transform:translateY(7px)}35%{opacity:.85}100%{opacity:0;transform:translateY(-13px)}}
@keyframes ppjump{0%,100%{transform:translateY(0)}35%{transform:translateY(-7px)}65%{transform:translateY(0)}}

@keyframes wxloginFloatB{from{transform:translate3d(0,22px,0) scale(1.08)}to{transform:translate3d(-75px,-35px,0) scale(.88)}}

@keyframes wxloginPulse{0%{opacity:.55;transform:scale(.84)}100%{opacity:0;transform:scale(1.2)}}
@keyframes wxloginCount{0%,100%{opacity:1}50%{opacity:.58}}

.remote-control-layer{position:absolute;inset:0;z-index:550;display:none;overflow:hidden;color:#f4f4f6;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;pointer-events:auto;}

.remote-control-who small{display:block;color:#74747b;font-size:9px;letter-spacing:.8px;margin-top:2px;}
.remote-elapsed{color:#ff4056;font-size:11px;font-variant-numeric:tabular-nums;}

.remote-pointer{position:absolute;z-index:5;width:19px;height:25px;left:var(--tap-x,65%);top:var(--tap-y,48%);opacity:0;filter:drop-shadow(0 4px 7px rgba(0,0,0,.7));transition:left .45s ease,top .45s ease;}

.remote-exit-notice{position:absolute;left:50%;top:72px;z-index:545;display:none;align-items:center;gap:8px;transform:translateX(-50%);max-width:86%;padding:9px 13px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(16,16,20,.92);color:#e8e8ee;font-size:12px;letter-spacing:.2px;box-shadow:0 10px 26px rgba(0,0,0,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}

@keyframes remoteLayerIn{from{opacity:0}to{opacity:1}}
@keyframes remoteCaptionUp{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}

.lockscreen{position:absolute;inset:0;z-index:435;display:flex;flex-direction:column;color:#fff;overflow:hidden;background:#08090d;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-100%);transition:opacity .46s ease,transform .62s cubic-bezier(.18,.88,.22,1),visibility .46s;}

.lockshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,.08) 38%,rgba(0,0,0,.55));}

.locktime{font-size:72px;font-weight:250;line-height:1;letter-spacing:0;font-variant-numeric:tabular-nums;}
.lockdate{margin-top:8px;font-size:15px;font-weight:560;color:rgba(255,255,255,.9);}

.locknote{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:18px;background:rgba(34,35,42,.58);border:1px solid rgba(255,255,255,.12);box-shadow:0 14px 32px rgba(0,0,0,.28);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);cursor:pointer;}
.locknote.fresh{animation:locknotein .48s cubic-bezier(.2,.8,.2,1) both;}
.locknote .avatar{width:30px;height:30px;flex-basis:30px;border-radius:9px;font-size:15px;}
.locknote .ltxt{flex:1;min-width:0}.locknote .lt{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.locknote .lb{font-size:12px;color:rgba(255,255,255,.78);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.locknote .lk{font-size:11px;color:rgba(255,255,255,.55);margin-left:6px;white-space:nowrap;}

.lockempty{padding:13px 15px;border-radius:18px;background:rgba(20,21,26,.28);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.62);font-size:12px;text-align:center;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.locknotes{margin-top:auto;margin-bottom:8px;}
.lockbottom{position:relative;z-index:2;margin-top:0;padding:0 26px 18px;display:grid;grid-template-columns:56px 1fr 56px;align-items:end;gap:16px;}
.lockquick{width:54px;height:54px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(24,25,30,.52);color:#fff;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 22px rgba(0,0,0,.28);cursor:pointer;}
.lockhint{text-align:center;align-self:center;font-size:12px;color:rgba(255,255,255,.72);text-shadow:0 2px 8px rgba(0,0,0,.45);}
.lockup{width:12px;height:12px;border-left:2px solid rgba(255,255,255,.88);border-top:2px solid rgba(255,255,255,.88);transform:rotate(45deg);margin:0 auto 8px;animation:lockuparrow 1.55s ease-in-out infinite;}
@keyframes lockuparrow{0%,100%{opacity:.46;transform:translateY(3px) rotate(45deg)}50%{opacity:.95;transform:translateY(-2px) rotate(45deg)}}
.lockhandle{width:118px;height:5px;border-radius:999px;background:rgba(255,255,255,.85);margin:10px auto 0;box-shadow:0 2px 8px rgba(0,0,0,.32);}
.lockpull{position:absolute;top:7px;left:50%;z-index:434;width:42px;height:24px;transform:translateX(-50%);border:0;border-radius:999px;background:rgba(28,29,34,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 7px 20px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.12);display:none;align-items:center;justify-content:center;cursor:pointer;}
.lockpull.show{display:flex;animation:lockpullin .28s ease both;}
.lockpull:before{content:"";width:10px;height:10px;border-right:2px solid rgba(255,255,255,.86);border-bottom:2px solid rgba(255,255,255,.86);transform:rotate(45deg) translateY(-2px);}

@media (max-height:690px){.locktop{padding-top:42px}.locktime{font-size:60px}.locknotes{max-height:42%;margin-bottom:10px}.lockbottom{padding-bottom:18px}}
